---
# infra/ansible/deploy.yml
# Ce playbook installe Docker sur la VM et déploie l'application

- name: Déploiement de l'application Todo sur staging
  hosts: staging
  become: true   # Exécute les commandes en sudo

  vars:
    app_dir: /opt/todo-devops
    db_name: tododb
    db_user: todouser
    db_password: todopass

  tasks:

    # ── 1. Installation de Docker via script officiel ──────────────
    - name: Vérifier si Docker est déjà installé
      command: docker --version
      register: docker_check
      ignore_errors: true
      changed_when: false

    - name: Télécharger et exécuter le script d'installation Docker
      shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Ajouter l'utilisateur ubuntu au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Démarrer et activer Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Vérifier que Docker fonctionne
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Afficher la version Docker installée
      debug:
        msg: "✅ {{ docker_version.stdout }}"

    # ── 2. Préparer le répertoire de l'application ─────────────────
    - name: Créer le dossier de l'application
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    # ── 3. Copier le docker-compose de production ──────────────────
    - name: Copier le docker-compose.prod.yml
      template:
        src: docker-compose.prod.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    # ── 4. Déployer les conteneurs ─────────────────────────────────
    - name: Puller les nouvelles images Docker
      shell: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Lancer les conteneurs (ou les redémarrer si déjà lancés)
      shell: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Vérifier que le backend répond
      uri:
        url: http://localhost:5000/health
        status_code: 200
      retries: 5
      delay: 5

    - name: ✅ Déploiement terminé
      debug:
        msg: "Application déployée avec succès sur {{ inventory_hostname }}"
