version: "3.9"

services:

  # ── Base de données PostgreSQL ───────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: todo-db
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    volumes:
      - db_data:/var/lib/postgresql/data   # Les données persistent entre redémarrages
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: todo-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USER: todouser
      DB_PASSWORD: todopass
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy   # Attend que la BDD soit prête
    restart: unless-stopped

  # ── Frontend React + Nginx ───────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:   # Volume nommé pour la persistance des données
