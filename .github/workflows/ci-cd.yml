name: CI/CD Pipeline

# Déclenché à chaque push sur main ou sur une Pull Request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 : BUILD & PUSH les images Docker
  # ─────────────────────────────────────────────
  build:
    name: 🔨 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code du repo
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Se connecter à Docker Hub
      - name: Login sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 3 : Activer le cache Docker (builds plus rapides)
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 4 : Builder et pusher l'image backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}   # Push seulement sur main
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Étape 5 : Builder et pusher l'image frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2 : TESTS (tourne en parallèle du build)
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest

    services:
      # Lance une vraie BDD PostgreSQL pour les tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tododb_test
          POSTGRES_USER: todouser
          POSTGRES_PASSWORD: todopass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances backend
        working-directory: ./backend
        run: npm install

      - name: Vérifier que le backend démarre correctement
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tododb_test
          DB_USER: todouser
          DB_PASSWORD: todopass
          PORT: 5000
        run: |
          node src/index.js &
          sleep 3
          curl --fail http://localhost:5000/health || exit 1
          echo "✅ Backend OK"

  # ─────────────────────────────────────────────
  # JOB 3 : DEPLOY sur staging (après build + test)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy sur Staging (OVH)
    runs-on: ubuntu-latest
    needs: [build, test]                          # Attend que build ET test soient OK
    if: github.ref == 'refs/heads/main'           # Seulement sur main

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Configurer la clé SSH pour OVH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Lancer le playbook Ansible (deploy)
        run: |
          ansible-playbook infra/ansible/deploy.yml \
            -i infra/ansible/inventory.ini \
            --extra-vars "backend_image=${{ env.BACKEND_IMAGE }}:${{ github.sha }} frontend_image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
